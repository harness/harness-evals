identifier: kg-prod-deploy-change-investigation
name: kg-prod-deploy-change-investigation Metrics
description: >-
  KG deploy-change investigation / "what changed" — PROD counterpart to
  kg-p0-deploy-change-investigation, run against a real customer account instead of the
  akshay_kg_test fixture. Local-run only. TWO GEval axes only: (1) groundedness/HQL
  lineage-traversal correctness, weighted higher, and (2) autonomous skill-invocation
  self-report, weighted lower. Judge via Harness LLM connector (connector_OpenAI_dd19).
tags: [kg, prod]
judge_model_id: null
judge_llm_connector_ref: connector_OpenAI_dd19
entries:
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Deploy-change investigation rubric - data-grounded correctness + HQL lineage-traversal validity, generalized away from any single account's fixture facts.
  threshold: 0.7
  weight: 0.8
  position: 0
  config:
    criteria: >-
      Judge a deploy-change investigation answer on two axes. AXIS A (data-grounded
      correctness): (1) cites real pipeline/service/environment names retrieved from the
      Knowledge Graph, not fabricated ones; (2) cites the real digest/commit_sha/repository_name
      values retrieved (not truncated or altered); (3) SCOPE ADHERENCE — the agent must query at the
      scope the question asks for and that this case's reference expected_output specifies (which may
      be project-level, org-level, or account-level depending on the case) — do not penalize or
      require any one specific scope as a blanket rule; instead, check the reference expected_output
      for this specific case to determine the correct scope, and score down only when the agent's
      actual query/answer scope doesn't match what that case's expected_output calls for; (4) when no PR entity is found for a commit, explicitly states
      that and does NOT assert or fabricate a PR number/link, even if the commit message text
      hints at one — citing the message text is fine, treating it as a confirmed PR is not; (5)
      when a named/queried service or deployment does not exist, explicitly states no such
      service/deployment exists and does not fabricate a digest, commit, PR, or change list; (6)
      does not invent any artifact/commit/PR/pipeline/service/environment name or digest not
      present in the retrieved data. AXIS B (HQL traversal validity of the HQL the agent reports
      it ran): VALID ENTITIES: pipeline:pipeline_execution, cd:stage_execution (the deployment —
      there is NO cd:deploy_execution), ci:artifact, ci:stage_execution (the CI build — there is
      NO ci:build_execution), ci:commit, ci:pr, cd:instance, cd:service, cd:environment. VALID
      RELATIONSHIPS AND JOIN KEYS (lineage): cd:stage_execution -> ci:artifact on digest = digest;
      ci:artifact -> ci:stage_execution on stage_execution_id = stage_execution_id;
      ci:stage_execution -> ci:commit on commit_sha = commit_sha; ci:pr -> ci:commit on
      commit_sha = commit_sha; pipeline:pipeline_execution -> cd:stage_execution and ->
      ci:stage_execution on plan_execution_id = plan_execution_id; cd:instance -> ci:artifact on
      digest = digest; cd:instance -> pipeline:pipeline_execution on last_plan_execution_id =
      plan_execution_id; cd:stage_execution -> cd:service on service_identifier = identifier (+
      scope) and -> cd:environment on env_identifier = identifier (+ scope). The lineage MUST
      hop deploy->artifact->build->commit->PR (or the reverse) on these keys; it must NOT
      shortcut deploy or commit across missing hops. Award 1.0 only when the HQL is a valid
      lineage traversal matching the expected entities/join keys AND the answer is fully
      data-grounded (real artifacts/commits/PRs/services, no fabrication) AND the agent
      correctly states no-data on any case where the retrieved data genuinely has none. Score
      0.0 for invalid/missing-hop joins, wrong keys, fabricated commits/PRs/services/digests, use
      of deprecated ci:pipeline_execution_summary / cd:pipeline_execution spines, or failure to
      state no-data when appropriate. Partial otherwise.
    options:
      evaluation_steps:
      - Extract the HQL query(ies) the agent reports it used from the answer.
      - Verify every entity referenced is valid (cd:stage_execution for deploy, ci:stage_execution for build, ci:artifact, ci:commit, ci:pr, cd:instance/service/environment); reject invented cd:deploy_execution / ci:build_execution.
      - Verify each lineage hop uses the declared key (digest for deploy<->artifact and instance<->artifact; stage_execution_id for artifact<->build; commit_sha for build<->commit and pr<->commit; plan_execution_id for execution<->stage; last_plan_execution_id=plan_execution_id for instance<->execution).
      - Confirm no hop is skipped (no direct deploy->commit, deploy->pr, or commit->pipeline_execution on mismatched keys).
      - Confirm the answer cites the real retrieved pipeline/service/environment/digest/commit_sha/repository_name values, not fabricated or altered ones, and constrains account/org/project scope. Specifically, check this case's reference expected_output to determine the correct scope (project/org/account) it specifies, then confirm the agent's query/answer actually operated at that scope, and did not present an empty result at the wrong scope as if it were a genuine no-data finding — do not apply any fixed org/account/project assumption across all cases.
      - For a no-PR case, confirm the agent states no ci:pr entity was found and does not assert a PR number/link from the commit message alone.
      - For a nonexistent-service/deployment case, confirm the agent states no such service/deployment exists and does not fabricate a change list.
      - Compare to the expected traversal and expectations in the reference expected_output; penalize any fabricated entity/value.
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Autonomous skill-invocation rubric — self-report cross-checked against grounded evidence of real KG querying.
  threshold: 0.7
  weight: 0.2
  position: 1
  config:
    criteria: >-
      Judge whether the agent's answer to this analytics question shows evidence of genuinely
      engaging with the Knowledge Graph, and whether its self-report (the closing "which skills
      did you use" response) accurately reflects that. Evaluate in this order: (1) SELF-REPORT:
      check whether the part of the answer responding to the "list which skills you loaded/used"
      instruction explicitly names the Knowledge Graph / kg_analysis skill as having been
      loaded/used (mentioning hql_reference too is a good additional signal but not required on
      its own). (2) GROUNDED CROSS-CHECK: cross-check that self-report against the substance of
      the rest of the answer — does it show real, concrete evidence of KG querying (actual HQL
      syntax, real entity/field names, real retrieved values/counts) versus just a bare,
      unsupported claim of "I used the KG skill" with no real querying behind it? (3) SCORING:
      score 0 (fail) if the agent shows NO evidence of engaging with the KG at all — e.g. it
      answers generically from reasoning/prior knowledge, declines to answer, or fabricates
      plausible-sounding facts without any real querying; this is the PRIMARY signal being
      tested. Score partial (~0.5) if the agent clearly performed real, grounded KG
      querying/HQL work but its self-report is incomplete, vague, or doesn't explicitly name the
      skill — this distinguishes "skill worked, just under-reported" from "skill never invoked."
      Score 1.0 only when the agent BOTH genuinely performed grounded KG querying AND explicitly
      self-reports having used the Knowledge Graph/kg_analysis skill.
    options:
      evaluation_steps:
      - Locate the part of the answer responding to the "explicitly list which skills you loaded/used" instruction.
      - Check whether that self-report explicitly names the Knowledge Graph / kg_analysis skill (bonus if hql_reference is also named).
      - Independently inspect the rest of the answer for concrete evidence of real KG querying — actual HQL syntax, real entity/field names, real retrieved values/counts.
      - If there is NO evidence of real KG querying anywhere in the answer (generic reasoning-based answer, a decline, or fabricated facts), score 0 regardless of what the self-report claims.
      - If there IS real, grounded KG querying evidence but the self-report omits or is vague about naming the skill, score ~0.5.
      - If there IS real, grounded KG querying evidence AND the self-report explicitly names the Knowledge Graph/kg_analysis skill, score 1.0.
      - Do not reward a bare unsupported claim of skill usage that isn't backed by real querying evidence in the answer.
