identifier: kg-prod-lead-time-for-change
name: kg-prod-lead-time-for-change Metrics
description: >-
  KG lead time for change — PROD counterpart to kg-p1-lead-time-for-change, run against a real
  customer account instead of the akshay_kg_test fixture. Local-run only. TWO GEval axes only:
  (1) groundedness/HQL-traversal correctness, weighted higher, and (2) autonomous
  skill-invocation self-report, weighted lower. Judge via Harness LLM connector
  (connector_OpenAI_dd19).
tags: [kg, prod]
judge_model_id: null
judge_llm_connector_ref: connector_OpenAI_dd19
entries:
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: HQL traversal correctness rubric for lead-time-for-change, generalized away from any single account's fixture facts.
  threshold: 0.7
  weight: 0.8
  position: 0
  config:
    criteria: >-
      Judge the correctness of the HQL query(ies) the agent reports it used to compute
      commit-to-build (or commit-to-production) lead time against the Harness Knowledge Graph
      model. SCOPE ADHERENCE: the agent must query at the scope the question asks for and that this
      case's reference expected_output specifies (which may be project-level, org-level, or
      account-level depending on the case) — do not penalize or require any one specific scope as a
      blanket rule; instead, check the reference expected_output for this specific case to determine
      the correct scope, and score down only when the agent's actual query/answer scope doesn't
      match what that case's expected_output calls for, e.g. reporting an empty/no-data answer or a
      fabricated proxy at the wrong scope. VALID ENTITIES: ci:commit, ci:pr, ci:stage_execution, ci:artifact,
      pipeline:pipeline, pipeline:pipeline_execution, cd:stage_execution. VALID RELATIONSHIPS AND
      JOIN KEYS: ci:commit <-> ci:stage_execution on commit_sha (commit to build);
      ci:stage_execution <-> pipeline:pipeline_execution on plan_execution_id;
      ci:pull_request_includes_commit / ci:commit_to_pr on commit_sha; pipeline:pipeline ->
      pipeline:pipeline_execution on identifier = pipeline_identifier; ci:stage_execution ->
      ci:artifact on stage_execution_id; ci:artifact <-> cd:stage_execution on digest (the
      build-to-deploy / artifact-based join, required for lead time to production). NOTE:
      ci:commit's real timestamp field is "commit_timestamp" (not "committed_at"). The traversal
      MUST hop commit->stage_execution->pipeline_execution on commit_sha and plan_execution_id
      respectively, and for production/deployment lead-time cases MUST continue
      stage_execution->artifact->cd:stage_execution on stage_execution_id and digest — it must
      NOT shortcut commit directly to pipeline_execution or to cd:stage_execution without these
      declared hops, and must NOT reference the deprecated ci:pipeline_execution_summary entity.
      When the CI build stage_execution and the CD deploy stage_execution share the SAME
      plan_execution_id, a direct plan_execution_id join between them is also a valid
      alternative to the artifact/digest hop — do not penalize this when it is genuinely the
      real shape of the account's data. Lead time must be computed as an actual time difference
      between matched real timestamps (e.g. via avg() over a computed duration), not asserted
      without a real aggregation; award full credit when the HQL is a valid traversal AND the
      natural-language answer reports a real, computed duration (no fabricated numbers) —
      UNLESS the agent states that ci:commit.commit_timestamp is null/empty/unusable for this
      account (from its own query results this turn), in which case award full credit for a
      correct traversal PLUS an explicit statement that the data does not support computing a
      numeric commit-anchored lead time, using build-execution-time (or another real, computed
      proxy) instead — do not require a computed duration anchored to commit_timestamp
      specifically once the agent has made this hedge. For a no-data case (e.g. a nonexistent
      repository/PR), the agent must refuse/state no data rather than fabricate a lead-time
      figure. Score 0.0 for invalid/missing-hop joins, wrong keys, or a fabricated lead-time
      figure (including a fabricated figure presented instead of a hedge/caveat when
      commit_timestamp data is genuinely missing). Partial otherwise; 1.0 only when the HQL is a
      valid, correctly-scoped traversal AND the reported duration/hedge is fully grounded.
    options:
      evaluation_steps:
      - Extract the HQL query(ies) the agent reports it used from the answer.
      - Check every entity referenced is valid for this use case (ci:commit, ci:pr, ci:stage_execution, ci:artifact, pipeline:pipeline, pipeline:pipeline_execution, cd:stage_execution) and that the deprecated ci:pipeline_execution_summary entity is not used.
      - FIRST check whether the answer explicitly states that ci:commit.commit_timestamp is null/empty/unusable for this account (from its own query this turn) AND reports a real computed proxy duration instead. If BOTH are true, this is a valid HEDGE-ALLOWANCE answer: do not penalize it for skipping the ci:commit->stage_execution commit_sha hop or the stage_execution<->pipeline_execution plan_execution_id hop.
      - IF the answer does NOT invoke the hedge allowance (i.e. it purports to compute a literal commit-anchored lead time without noting a commit_timestamp gap), THEN check the commit->stage_execution hop uses commit_sha and the stage_execution<->pipeline_execution hop uses plan_execution_id; reject any direct commit-to-execution shortcut.
      - IF the answer does NOT invoke the hedge allowance AND the question is about production/deployment lead-time, check the traversal continues stage_execution->artifact on stage_execution_id and artifact<->cd:stage_execution on digest, OR uses the direct same-plan_execution_id join when the CI build and CD deploy genuinely share one pipeline execution; reject any shortcut straight from commit to cd:stage_execution with neither hop.
      - Check PR-scoped variants join ci:pr to ci:commit on commit_sha before reaching the build, not directly to a build/execution.
      - Confirm lead time is computed from real matched timestamps via aggregation (e.g. avg, date_trunc for trend buckets), not asserted — UNLESS the hedge allowance applies, in which case a real proxy aggregation satisfies this step.
      - Confirm the HQL constrains account/org/project scope and the question's time window where applicable, and compare the entities/join path used against the expected traversal in the reference; for a no-data question require an explicit refusal. Specifically, check this case's reference expected_output to determine the correct scope (project/org/account) it specifies, then confirm the agent's query/answer actually operated at that scope, and did not present an empty result at the wrong scope as if it were a genuine no-data finding — do not apply any fixed org/account/project assumption across all cases.
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Autonomous skill-invocation rubric — self-report cross-checked against grounded evidence of real KG querying.
  threshold: 0.7
  weight: 0.2
  position: 1
  config:
    criteria: >-
      Judge whether the agent's answer to this analytics question shows evidence of genuinely
      engaging with the Knowledge Graph, and whether its self-report (the closing "which skills
      did you use" response) accurately reflects that. Evaluate in this order: (1) SELF-REPORT:
      check whether the part of the answer responding to the "list which skills you loaded/used"
      instruction explicitly names the Knowledge Graph / kg_analysis skill as having been
      loaded/used (mentioning hql_reference too is a good additional signal but not required on
      its own). (2) GROUNDED CROSS-CHECK: cross-check that self-report against the substance of
      the rest of the answer — does it show real, concrete evidence of KG querying (actual HQL
      syntax, real entity/field names, real retrieved values/counts) versus just a bare,
      unsupported claim of "I used the KG skill" with no real querying behind it? (3) SCORING:
      score 0 (fail) if the agent shows NO evidence of engaging with the KG at all — e.g. it
      answers generically from reasoning/prior knowledge, declines to answer, or fabricates
      plausible-sounding facts without any real querying; this is the PRIMARY signal being
      tested. Score partial (~0.5) if the agent clearly performed real, grounded KG
      querying/HQL work but its self-report is incomplete, vague, or doesn't explicitly name the
      skill — this distinguishes "skill worked, just under-reported" from "skill never invoked."
      Score 1.0 only when the agent BOTH genuinely performed grounded KG querying AND explicitly
      self-reports having used the Knowledge Graph/kg_analysis skill.
    options:
      evaluation_steps:
      - Locate the part of the answer responding to the "explicitly list which skills you loaded/used" instruction.
      - Check whether that self-report explicitly names the Knowledge Graph / kg_analysis skill (bonus if hql_reference is also named).
      - Independently inspect the rest of the answer for concrete evidence of real KG querying — actual HQL syntax, real entity/field names, real retrieved values/counts.
      - If there is NO evidence of real KG querying anywhere in the answer (generic reasoning-based answer, a decline, or fabricated facts), score 0 regardless of what the self-report claims.
      - If there IS real, grounded KG querying evidence but the self-report omits or is vague about naming the skill, score ~0.5.
      - If there IS real, grounded KG querying evidence AND the self-report explicitly names the Knowledge Graph/kg_analysis skill, score 1.0.
      - Do not reward a bare unsupported claim of skill usage that isn't backed by real querying evidence in the answer.
