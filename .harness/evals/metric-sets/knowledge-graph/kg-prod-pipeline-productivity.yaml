identifier: kg-prod-pipeline-productivity
name: kg-prod-pipeline-productivity Metrics
description: >-
  KG productivity recommendations — PROD counterpart to kg-p0-pipeline-productivity, run against
  a real customer account instead of the akshay_kg_test fixture. Local-run only. TWO GEval axes
  only: (1) groundedness/HQL-traversal + actionability correctness, weighted higher, and (2)
  autonomous skill-invocation self-report, weighted lower. Judge via Harness LLM connector
  (connector_OpenAI_dd19).
tags: [kg, prod]
judge_model_id: null
judge_llm_connector_ref: connector_OpenAI_dd19
entries:
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Groundedness + HQL traversal validity + actionability rubric for productivity recommendations, generalized away from any single account's fixture facts.
  threshold: 0.7
  weight: 0.8
  position: 0
  config:
    criteria: >-
      Judge a pipeline PRODUCTIVITY recommendation answer on two axes. AXIS A (data-grounded
      correctness): (1) cites real pipeline/stage/step names retrieved from the Knowledge Graph,
      not fabricated ones; (2) includes supporting numbers (counts, rates, percentages,
      durations) for any rankings,       grounded in a real query the agent shows; (3) honors the time
      window in the question; (4) SCOPE ADHERENCE — the agent must query at the scope the question
      asks for and that this case's reference expected_output specifies (which may be
      project-level, org-level, or account-level depending on the case) — do not penalize or require
      any one specific scope as a blanket rule; instead, check the reference expected_output for
      this specific case to determine the correct scope, and score down only when the agent's
      actual query/answer scope doesn't match what that case's expected_output calls for; (5) for non-existent/missing entities explicitly states no data is
      available; (6) does not invent pipelines, stages,
      steps, or numeric values; and each recommendation must be tied to specific retrieved
      slow/flaky/failing stages, not generic best-practice filler like "add more tests" or
      "improve monitoring". AXIS B (HQL traversal validity of the HQL the agent reports it ran):
      the traversal must use only valid KG entities (pipeline:pipeline, pipeline:pipeline_execution,
      pipeline:stage_execution, pipeline:step_execution, ci:stage_execution) and declared join
      keys — pipeline:pipeline -> pipeline:pipeline_execution on parent_unique_id + identifier =
      parent_unique_id + pipeline_identifier; pipeline:pipeline_execution -> pipeline:stage_execution
      / ci:stage_execution on plan_execution_id = plan_execution_id; pipeline:stage_execution ->
      pipeline:step_execution on stage_execution_id = stage_execution_id. Retries/rework must be
      read from pipeline:step_execution.is_retried/retry_ids and durations from stage/step
      timestamps, and the query must constrain account/org/project scope + the time window.
      Penalize invalid/nonexistent joins or use of the deprecated ci:pipeline_execution_summary /
      cd:pipeline_execution as the spine. Score 1.0 only when the answer is data-grounded AND
      the emitted HQL is a valid, correctly-scoped traversal AND recommendations are concrete;
      0.0 if any entity is fabricated, the HQL uses an invalid join, or the agent fails to state
      no-data when appropriate; partial otherwise.
    options:
      evaluation_steps:
      - Extract the HQL query(ies) the agent reports it used from the answer.
      - Verify every entity referenced is a valid KG entity (pipeline:pipeline, pipeline:pipeline_execution, pipeline:stage_execution, pipeline:step_execution, ci:stage_execution).
      - Verify each join uses the declared key (parent_unique_id+identifier=parent_unique_id+pipeline_identifier; plan_execution_id=plan_execution_id for execution->stage/ci; stage_execution_id=stage_execution_id for stage->step).
      - Confirm retries/rework come from pipeline:step_execution.is_retried/retry_ids and durations from stage/step timestamps.
      - Confirm the HQL constrains account/org/project scope and the question's time window without broadening. Specifically, check this case's reference expected_output to determine the correct scope (project/org/account) it specifies, then confirm the agent's query/answer actually operated at that scope, and did not present an empty result at the wrong scope as if it were a genuine no-data finding — do not apply any fixed org/account/project assumption across all cases.
      - Reject deprecated summary spines (ci:pipeline_execution_summary / cd:pipeline_execution).
      - Confirm recommendations name specific slow/flaky/failing stages backed by retrieved data, and require an explicit no-data statement where appropriate.
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Autonomous skill-invocation rubric — self-report cross-checked against grounded evidence of real KG querying.
  threshold: 0.7
  weight: 0.2
  position: 1
  config:
    criteria: >-
      Judge whether the agent's answer to this analytics question shows evidence of genuinely
      engaging with the Knowledge Graph, and whether its self-report (the closing "which skills
      did you use" response) accurately reflects that. Evaluate in this order: (1) SELF-REPORT:
      check whether the part of the answer responding to the "list which skills you loaded/used"
      instruction explicitly names the Knowledge Graph / kg_analysis skill as having been
      loaded/used (mentioning hql_reference too is a good additional signal but not required on
      its own). (2) GROUNDED CROSS-CHECK: cross-check that self-report against the substance of
      the rest of the answer — does it show real, concrete evidence of KG querying (actual HQL
      syntax, real entity/field names, real retrieved values/counts) versus just a bare,
      unsupported claim of "I used the KG skill" with no real querying behind it? (3) SCORING:
      score 0 (fail) if the agent shows NO evidence of engaging with the KG at all — e.g. it
      answers generically from reasoning/prior knowledge, declines to answer, or fabricates
      plausible-sounding facts without any real querying; this is the PRIMARY signal being
      tested. Score partial (~0.5) if the agent clearly performed real, grounded KG
      querying/HQL work but its self-report is incomplete, vague, or doesn't explicitly name the
      skill — this distinguishes "skill worked, just under-reported" from "skill never invoked."
      Score 1.0 only when the agent BOTH genuinely performed grounded KG querying AND explicitly
      self-reports having used the Knowledge Graph/kg_analysis skill.
    options:
      evaluation_steps:
      - Locate the part of the answer responding to the "explicitly list which skills you loaded/used" instruction.
      - Check whether that self-report explicitly names the Knowledge Graph / kg_analysis skill (bonus if hql_reference is also named).
      - Independently inspect the rest of the answer for concrete evidence of real KG querying — actual HQL syntax, real entity/field names, real retrieved values/counts.
      - If there is NO evidence of real KG querying anywhere in the answer (generic reasoning-based answer, a decline, or fabricated facts), score 0 regardless of what the self-report claims.
      - If there IS real, grounded KG querying evidence but the self-report omits or is vague about naming the skill, score ~0.5.
      - If there IS real, grounded KG querying evidence AND the self-report explicitly names the Knowledge Graph/kg_analysis skill, score 1.0.
      - Do not reward a bare unsupported claim of skill usage that isn't backed by real querying evidence in the answer.
