identifier: kg-prod-security-compliance-verification
name: kg-prod-security-compliance-verification Metrics
description: >-
  KG security compliance verification — PROD counterpart to kg-p1-security-compliance-verification,
  run against a real customer account instead of the akshay_kg_test fixture. Local-run only.
  TWO GEval axes only: (1) groundedness/HQL-traversal validity + required hedging, weighted
  higher, and (2) autonomous skill-invocation self-report, weighted lower. Judge via Harness LLM
  connector (connector_OpenAI_dd19).
tags: [kg, prod]
judge_model_id: null
judge_llm_connector_ref: connector_OpenAI_dd19
entries:
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Security compliance verification rubric - data-grounded correctness + HQL traversal validity + required hedging on unverifiable claims, generalized away from any single account's fixture facts.
  threshold: 0.7
  weight: 0.8
  position: 0
  config:
    criteria: >-
      Judge a security compliance verification answer on two axes. AXIS A (data-grounded
      correctness): cites real pipeline/severity/status/exemption values retrieved from the
      Knowledge Graph, not fabricated ones, and does not invent any pipeline/scan/detection value
      not present in the retrieved data. SCOPE ADHERENCE (applies across all sub-questions below):
      the agent must query at the scope the question asks for and that this case's reference
      expected_output specifies (which may be project-level, org-level, or account-level depending on
      the case) — do not penalize or require any one specific scope as a blanket rule; instead, check
      the reference expected_output for this specific case to determine the correct scope, and score
      down only when the agent's actual query/answer scope doesn't match what that case's
      expected_output calls for. For a "skipped mandatory security check" question, the
      agent must find and report on SecurityTests-typed rows with status exactly 'SKIPPED', using
      EITHER pipeline:step_execution (step_type='SecurityTests') OR pipeline:stage_execution
      (stage_type='SecurityTests') — both are equally valid, so do not require step-level
      granularity when stage-level is used, or correctly report zero if none found. Scan the FULL
      reported query output/tables (not just headline narrative prose) for this check, and credit
      it even if buried alongside a different primary signal (e.g. OPA policy compliance);
      supplementary context is fine but must not replace this check entirely. For an
      open-vulnerability question, the agent must report real severity counts (e.g. from
      sto:detection or sto:issue) and must not assert a specific exemption/approval outcome not
      backed by real data — noting most detections lack an exemption decision is correct and
      sufficient; exact counts will vary by account and over time, so an exact match to any
      specific expected number is not required. For an override/waiver-rate question, the agent
      must not fabricate a specific override percentage or rate not backed by a real
      sto:exemption query; crediting a real (possibly small) exemption result set with an
      appropriate caveat is correct, not a total refusal. For a fixture/pipeline-scoped findings
      question, the hard requirement is that the agent queried sto:scan (or used it for
      scan/product context) scoped to the named pipeline AND reports real, correctly-sourced
      severity/finding counts (via sto:detection or sto:issue); restating scan-execution
      metadata is a nice-to-have, not a hard requirement. For a nonexistent-pipeline/no-data
      case, the agent must explicitly state no such pipeline/data exists and not fabricate a
      compliance status or findings. AXIS B (HQL traversal validity): VALID ENTITIES:
      pipeline:pipeline, pipeline:pipeline_execution, pipeline:stage_execution,
      pipeline:step_execution, sto:scan, sto:detection, sto:issue, sto:target,
      sto:target_variant, sto:exemption, and any other kg:visible-annotated entity that
      plausibly answers the question. Do NOT penalize substituting one valid entity for another
      (e.g. sto:issue instead of sto:detection) as long as the reported values are real and
      correctly answer the question. sto:scan and sto:detection are ACCOUNT-SCOPED ONLY (no
      project_identifier/org_identifier field) — they must be filtered by pipeline_identifier /
      account context directly, not by claiming an unsupported project-scope join. A skipped
      mandatory check = a SecurityTests-typed pipeline:step_execution (or stage_execution) with
      status exactly 'SKIPPED'. Award 1.0 only when the answer is fully data-grounded, uses a
      valid entity for the specific case, correctly hedges on exemption-rate/override-rate
      questions, and correctly states no-data on a no-data case. Score 0.0 for a fabricated
      compliance verdict, a fabricated override/exemption rate not backed by any real query, an
      unhedged production/compliance claim not backed by a literal field value, or failure to
      state no-data when appropriate. Partial otherwise.
    options:
      evaluation_steps:
      - Extract the HQL query(ies) the agent reports it used from the answer, and verify every entity referenced is a valid, kg:visible entity for this use case; do not penalize substituting one valid entity for another as long as the reported values are real and correctly answer the question.
      - Check this case's reference expected_output to determine the correct scope (project/org/account) it specifies, then confirm the agent's query/answer actually operated at that scope, and did not present an empty result at the wrong scope as if it were a genuine no-data finding — do not apply any fixed org/account/project assumption across all cases.
      - For a SKIPPED-check question, confirm the bypass determination uses EITHER pipeline:step_execution (step_type='SecurityTests') OR pipeline:stage_execution (stage_type='SecurityTests') AND status='SKIPPED' exactly. Scan the FULL reported query output/tables (not just headline narrative prose) for this count, and credit it when present and real even if buried in a broader compliance report.
      - For an open-vulnerability question, confirm the agent reports real severity counts and does not fabricate an exemption/approval outcome beyond what a real query would show.
      - For an override/waiver-rate question, confirm the agent does not state a specific override percentage or rate not backed by a real sto:exemption query; crediting a small real result set is correct.
      - For a fixture/pipeline-scoped findings question, confirm the agent queried sto:scan scoped to the pipeline (or used it for scan/product context) and reports real, correctly-sourced severity/finding counts.
      - For a nonexistent-pipeline/no-data case, confirm the agent states no such pipeline/data was found and does not fabricate a compliance status.
      - Compare to the expected traversal and hedging expectations in the reference expected_output; penalize only fabricated entities/values or unhedged confident claims, not the use of an alternative valid entity/traversal path.
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Autonomous skill-invocation rubric — self-report cross-checked against grounded evidence of real KG querying.
  threshold: 0.7
  weight: 0.2
  position: 1
  config:
    criteria: >-
      Judge whether the agent's answer to this analytics question shows evidence of genuinely
      engaging with the Knowledge Graph, and whether its self-report (the closing "which skills
      did you use" response) accurately reflects that. Evaluate in this order: (1) SELF-REPORT:
      check whether the part of the answer responding to the "list which skills you loaded/used"
      instruction explicitly names the Knowledge Graph / kg_analysis skill as having been
      loaded/used (mentioning hql_reference too is a good additional signal but not required on
      its own). (2) GROUNDED CROSS-CHECK: cross-check that self-report against the substance of
      the rest of the answer — does it show real, concrete evidence of KG querying (actual HQL
      syntax, real entity/field names, real retrieved values/counts) versus just a bare,
      unsupported claim of "I used the KG skill" with no real querying behind it? (3) SCORING:
      score 0 (fail) if the agent shows NO evidence of engaging with the KG at all — e.g. it
      answers generically from reasoning/prior knowledge, declines to answer, or fabricates
      plausible-sounding facts without any real querying; this is the PRIMARY signal being
      tested. Score partial (~0.5) if the agent clearly performed real, grounded KG
      querying/HQL work but its self-report is incomplete, vague, or doesn't explicitly name the
      skill — this distinguishes "skill worked, just under-reported" from "skill never invoked."
      Score 1.0 only when the agent BOTH genuinely performed grounded KG querying AND explicitly
      self-reports having used the Knowledge Graph/kg_analysis skill.
    options:
      evaluation_steps:
      - Locate the part of the answer responding to the "explicitly list which skills you loaded/used" instruction.
      - Check whether that self-report explicitly names the Knowledge Graph / kg_analysis skill (bonus if hql_reference is also named).
      - Independently inspect the rest of the answer for concrete evidence of real KG querying — actual HQL syntax, real entity/field names, real retrieved values/counts.
      - If there is NO evidence of real KG querying anywhere in the answer (generic reasoning-based answer, a decline, or fabricated facts), score 0 regardless of what the self-report claims.
      - If there IS real, grounded KG querying evidence but the self-report omits or is vague about naming the skill, score ~0.5.
      - If there IS real, grounded KG querying evidence AND the self-report explicitly names the Knowledge Graph/kg_analysis skill, score 1.0.
      - Do not reward a bare unsupported claim of skill usage that isn't backed by real querying evidence in the answer.
