identifier: kg-prod-security-scan-bypass-detection
name: kg-prod-security-scan-bypass-detection Metrics
description: >-
  KG security scan bypass detection — PROD counterpart to kg-p1-security-scan-bypass-detection,
  run against a real customer account instead of the akshay_kg_test fixture. Local-run only.
  TWO GEval axes only: (1) groundedness/HQL-join validity + required hedging, weighted higher,
  and (2) autonomous skill-invocation self-report, weighted lower. Judge via Harness LLM
  connector (connector_OpenAI_dd19).
tags: [kg, prod]
judge_model_id: null
judge_llm_connector_ref: connector_OpenAI_dd19
entries:
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Security scan bypass detection rubric - data-grounded correctness + HQL join validity + required hedging on unverifiable production/bypass claims, generalized away from any single account's fixture facts.
  threshold: 0.7
  weight: 0.8
  position: 0
  config:
    criteria: >-
      Judge a security scan bypass / CVE correlation answer on two axes. AXIS A (data-grounded
      correctness): cites real artifact/CVE/severity/scan values retrieved from the Knowledge
      Graph, not fabricated ones, and does not invent any artifact/CVE/scan value not present in
      the retrieved data. SCOPE ADHERENCE (applies across all sub-questions below): the agent must
      query at the scope the question asks for and that this case's reference expected_output
      specifies (which may be project-level, org-level, or account-level depending on the case) — do
      not penalize or require any one specific scope as a blanket rule; instead, check the reference
      expected_output for this specific case to determine the correct scope, and score down only when
      the agent's actual query/answer scope doesn't match what that case's expected_output calls for.
      For "which containers have vulnerabilities above CVSS N" style
      questions, credit ANY of the valid chains — the SSCA chain ssca:artifact ->
      ssca:sbom_component -> ssca:component_vulnerability (join keys below), the STO chain
      sto:scan -> sto:target -> sto:target_variant -> sto:issue_scan / sto:issue filtered to
      severity/CVSS, or sto:issue_scan joined to sto:scan_container_image on scan_internal_id (+
      account_identifier) — do not penalize which chain is used. Only penalize a production
      claim if the agent affirmatively claims/implies current production deployment without
      real supporting evidence for that specific account's data (e.g. a production-flag field
      that turns out to show no artifacts flagged, used without the corresponding hedge); do NOT
      require a proactive production hedge when the question never raises production. For
      "deploy without a clean scan" / coverage-gap style questions, if a join used to correlate
      scan coverage to a specific project/team's deployment volume doesn't reliably resolve
      (e.g. an entity that is account-scoped only, or a known 0-match join), the agent must
      hedge (possible coverage gap / cannot confirm) rather than asserting a confirmed bypass or
      ranked list of offending teams; a real, working project/pipeline-scoped alternative signal
      (e.g. pipeline:stage_execution filtered to stage_type='SecurityTests') is acceptable if
      accurately framed as failed/bypassed-stage counts, not a confirmed bypass claim. For
      "critical vuln in production" style questions, either a working cd:stage_execution-based
      join to scan/vulnerability data, or an artifact production-flag field/entity, is valid; if
      the production-flag path shows no artifacts are ever flagged, the agent must hedge that
      rather than asserting a confirmed production deployment. For a nonexistent-pipeline/no-data
      case, the agent must explicitly state no such pipeline/data exists and not fabricate a
      bypass verdict. AXIS B (HQL join validity): if the SSCA chain is used, confirm
      artifact<->sbom_component uses uuid = artifact_v2_id (not digest — ssca:sbom_component has
      no digest field), and sbom_component<->component_vulnerability uses purl. If the
      sto:issue_scan+sto:scan_container_image variant is used, confirm the join is on
      scan_internal_id (+ account_identifier). Do NOT penalize using one valid entity
      chain/path over another as long as reported values are real and the required
      hedge/framing for whichever path was used is present. Score 0.0 for a fabricated
      production-deployment claim, a fabricated bypass verdict/ranking not backed by a literal
      status or working join, wrong join keys within the SSCA chain, or failure to state no-data
      on a genuine no-data case. Partial otherwise; 1.0 only when fully data-grounded with the
      correct hedge/framing for whichever path was used.
    options:
      evaluation_steps:
      - Extract the HQL query(ies) the agent reports it used from the answer, and verify every entity referenced is a valid, kg:visible entity for this use case (ssca:artifact, ssca:sbom_component, ssca:component_vulnerability, sto:scan, sto:target, sto:target_variant, sto:issue, sto:issue_scan, sto:scan_container_image, pipeline:pipeline, pipeline:pipeline_execution, pipeline:stage_execution, cd:stage_execution).
      - Check this case's reference expected_output to determine the correct scope (project/org/account) it specifies, then confirm the agent's query/answer actually operated at that scope, and did not present an empty result at the wrong scope as if it were a genuine no-data finding — do not apply any fixed org/account/project assumption across all cases.
      - If the SSCA chain is used, confirm artifact<->sbom_component uses uuid = artifact_v2_id (not digest), and sbom_component<->component_vulnerability uses purl. If the sto:issue_scan+sto:scan_container_image variant is used, confirm the join is on scan_internal_id (+ account_identifier).
      - For a CVSS-threshold question, confirm the answer reports real findings via any valid chain, and only penalize a production claim when affirmatively made without real supporting evidence; do not require a proactive production hedge when the question never raises production.
      - For a coverage-gap question, confirm the agent hedges (possible gap / cannot confirm) when using an unreliable/account-scoped-only join, or accurately frames a working project/pipeline-scoped alternative as failed/bypassed-stage counts rather than a confirmed bypass claim.
      - For a production-correlation question, confirm the agent hedges when using a production-flag field/entity that shows no artifacts flagged, or reports real values without a hedge when using a working cd:stage_execution-based join.
      - For a nonexistent-pipeline/no-data case, confirm the agent states no such pipeline/data was found and does not fabricate a bypass verdict.
      - Compare to the expected traversal and hedging expectations in the reference expected_output; penalize only fabricated entities/values or unhedged confident claims not backed by the path actually used.
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Autonomous skill-invocation rubric — self-report cross-checked against grounded evidence of real KG querying.
  threshold: 0.7
  weight: 0.2
  position: 1
  config:
    criteria: >-
      Judge whether the agent's answer to this analytics question shows evidence of genuinely
      engaging with the Knowledge Graph, and whether its self-report (the closing "which skills
      did you use" response) accurately reflects that. Evaluate in this order: (1) SELF-REPORT:
      check whether the part of the answer responding to the "list which skills you loaded/used"
      instruction explicitly names the Knowledge Graph / kg_analysis skill as having been
      loaded/used (mentioning hql_reference too is a good additional signal but not required on
      its own). (2) GROUNDED CROSS-CHECK: cross-check that self-report against the substance of
      the rest of the answer — does it show real, concrete evidence of KG querying (actual HQL
      syntax, real entity/field names, real retrieved values/counts) versus just a bare,
      unsupported claim of "I used the KG skill" with no real querying behind it? (3) SCORING:
      score 0 (fail) if the agent shows NO evidence of engaging with the KG at all — e.g. it
      answers generically from reasoning/prior knowledge, declines to answer, or fabricates
      plausible-sounding facts without any real querying; this is the PRIMARY signal being
      tested. Score partial (~0.5) if the agent clearly performed real, grounded KG
      querying/HQL work but its self-report is incomplete, vague, or doesn't explicitly name the
      skill — this distinguishes "skill worked, just under-reported" from "skill never invoked."
      Score 1.0 only when the agent BOTH genuinely performed grounded KG querying AND explicitly
      self-reports having used the Knowledge Graph/kg_analysis skill.
    options:
      evaluation_steps:
      - Locate the part of the answer responding to the "explicitly list which skills you loaded/used" instruction.
      - Check whether that self-report explicitly names the Knowledge Graph / kg_analysis skill (bonus if hql_reference is also named).
      - Independently inspect the rest of the answer for concrete evidence of real KG querying — actual HQL syntax, real entity/field names, real retrieved values/counts.
      - If there is NO evidence of real KG querying anywhere in the answer (generic reasoning-based answer, a decline, or fabricated facts), score 0 regardless of what the self-report claims.
      - If there IS real, grounded KG querying evidence but the self-report omits or is vague about naming the skill, score ~0.5.
      - If there IS real, grounded KG querying evidence AND the self-report explicitly names the Knowledge Graph/kg_analysis skill, score 1.0.
      - Do not reward a bare unsupported claim of skill usage that isn't backed by real querying evidence in the answer.
