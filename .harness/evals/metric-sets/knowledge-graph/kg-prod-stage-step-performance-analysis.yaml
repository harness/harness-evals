identifier: kg-prod-stage-step-performance-analysis
name: kg-prod-stage-step-performance-analysis Metrics
description: >-
  KG stage/step performance analysis — PROD counterpart to kg-p1-stage-step-performance-analysis,
  run against a real customer account instead of the akshay_kg_test fixture. Local-run only.
  TWO GEval axes only: (1) groundedness/HQL-traversal + failure-rate-grounding correctness,
  weighted higher, and (2) autonomous skill-invocation self-report, weighted lower. Judge via
  Harness LLM connector (connector_OpenAI_dd19).
tags: [kg, prod]
judge_model_id: null
judge_llm_connector_ref: connector_OpenAI_dd19
entries:
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Stage/step performance analysis rubric - duration spine validity, failure-rate aggregation grounding, and wait-state-vs-execution-slowness hedging, generalized away from any single account's fixture facts.
  threshold: 0.7
  weight: 0.8
  position: 0
  config:
    criteria: >-
      Judge a stage/step performance analysis answer on three axes. AXIS A (duration spine
      validity): the underlying entities and join keys used to ground stage/step identity and
      duration must be correct — pipeline:stage_execution.duration and
      pipeline:step_execution.duration (precomputed ms fields) joined via
      pipeline:pipeline_execution -> pipeline:stage_execution on plan_execution_id =
      plan_execution_id -> pipeline:step_execution on stage_execution_id = stage_execution_id.
      Full credit does not require the agent to explicitly narrate this exact join chain in
      prose. Only score down on this axis when the entities/joins actually used are wrong,
      deprecated (ci:pipeline_execution_summary / cd:pipeline_execution), or fabricated. Also on
      this axis, SCOPE ADHERENCE: the agent must query at the scope the question asks for and that
      this case's reference expected_output specifies (which may be project-level, org-level, or
      account-level depending on the case) — do not penalize or require any one specific scope as a
      blanket rule; instead, check the reference expected_output for this specific case to determine
      the correct scope, and score down only when the agent's actual query/answer scope doesn't
      match what that case's expected_output calls for. AXIS B
      (failure-rate aggregation grounding): for questions about which step/stage fails most
      often, the agent must group by step_identifier/stage_identifier across multiple
      executions and report an actual count or ratio grounded in retrieved data — a vague
      qualitative guess with no count/ratio scores 0 on this axis. AXIS C (wait-state vs genuine
      execution slowness): when a question involves a manual-approval or other wait-state
      stage/step, the agent must recognize (if the retrieved data shows it, e.g. an
      Approval-typed step with a configured timeout and no approver) that the elapsed duration
      reflects blocked-on-human-input wait time, not genuine compute/execution work, and must
      NOT recommend performance optimization (caching, parallelization, etc.) for that step —
      score down for any answer that treats a genuine wait-state timeout as a slow-running task
      to optimize. AXIS D (no fabrication, applies throughout): the agent must not invent
      specific duration numbers, failure counts, or step/stage/pipeline names not grounded in
      real retrieved data. Score 1.0 only when all applicable axes are satisfied AND no value is
      fabricated; 0.0 for any fabricated duration/count, an invalid/deprecated join, or a
      wait-state misclassified as execution slowness; partial otherwise.
    options:
      evaluation_steps:
      - Extract the HQL query(ies) the agent reports it used from the answer.
      - Verify the entities/join keys actually used to ground stage/step identity and duration are pipeline:pipeline_execution -> pipeline:stage_execution (plan_execution_id=plan_execution_id) -> pipeline:step_execution (stage_execution_id=stage_execution_id) reading the precomputed duration fields; only penalize when the entities/joins actually used are wrong, deprecated, or fabricated.
      - Check this case's reference expected_output to determine the correct scope (project/org/account) it specifies, then confirm the agent's query/answer actually operated at that scope, and did not present an empty result at the wrong scope as if it were a genuine no-data finding — do not apply any fixed org/account/project assumption across all cases.
      - For failure-rate questions, confirm the agent grouped by step_identifier/stage_identifier across multiple executions and cited an actual count or ratio from retrieved data, not a vague qualitative claim.
      - For questions touching a manual-approval or wait-state stage/step, confirm the agent explicitly distinguishes wait-on-human-input duration from genuine execution/compute duration (when the retrieved data supports that distinction) and does not recommend optimizing/caching/parallelizing a genuine wait-state step.
      - Compare all cited pipeline/stage/step durations, counts, and ratios to the reference expected_output's described expectations and penalize any fabricated entity, duration, or numeric value.
      - Confirm remediation (where asked) is concrete and tied to the specific retrieved bottleneck step/stage or failure pattern, not generic advice.
- metric:
    name: GEvalMetric
    kind: geval
    type: llm
    dimension: correctness
    description: Autonomous skill-invocation rubric — self-report cross-checked against grounded evidence of real KG querying.
  threshold: 0.7
  weight: 0.2
  position: 1
  config:
    criteria: >-
      Judge whether the agent's answer to this analytics question shows evidence of genuinely
      engaging with the Knowledge Graph, and whether its self-report (the closing "which skills
      did you use" response) accurately reflects that. Evaluate in this order: (1) SELF-REPORT:
      check whether the part of the answer responding to the "list which skills you loaded/used"
      instruction explicitly names the Knowledge Graph / kg_analysis skill as having been
      loaded/used (mentioning hql_reference too is a good additional signal but not required on
      its own). (2) GROUNDED CROSS-CHECK: cross-check that self-report against the substance of
      the rest of the answer — does it show real, concrete evidence of KG querying (actual HQL
      syntax, real entity/field names, real retrieved values/counts) versus just a bare,
      unsupported claim of "I used the KG skill" with no real querying behind it? (3) SCORING:
      score 0 (fail) if the agent shows NO evidence of engaging with the KG at all — e.g. it
      answers generically from reasoning/prior knowledge, declines to answer, or fabricates
      plausible-sounding facts without any real querying; this is the PRIMARY signal being
      tested. Score partial (~0.5) if the agent clearly performed real, grounded KG
      querying/HQL work but its self-report is incomplete, vague, or doesn't explicitly name the
      skill — this distinguishes "skill worked, just under-reported" from "skill never invoked."
      Score 1.0 only when the agent BOTH genuinely performed grounded KG querying AND explicitly
      self-reports having used the Knowledge Graph/kg_analysis skill.
    options:
      evaluation_steps:
      - Locate the part of the answer responding to the "explicitly list which skills you loaded/used" instruction.
      - Check whether that self-report explicitly names the Knowledge Graph / kg_analysis skill (bonus if hql_reference is also named).
      - Independently inspect the rest of the answer for concrete evidence of real KG querying — actual HQL syntax, real entity/field names, real retrieved values/counts.
      - If there is NO evidence of real KG querying anywhere in the answer (generic reasoning-based answer, a decline, or fabricated facts), score 0 regardless of what the self-report claims.
      - If there IS real, grounded KG querying evidence but the self-report omits or is vague about naming the skill, score ~0.5.
      - If there IS real, grounded KG querying evidence AND the self-report explicitly names the Knowledge Graph/kg_analysis skill, score 1.0.
      - Do not reward a bare unsupported claim of skill usage that isn't backed by real querying evidence in the answer.
