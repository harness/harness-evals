# Example: evaluate the Harness Unified Agent against production-derived goldens.
#
# The dataset is produced from real prod conversations by
# examples/langfuse-prod-datasets/scripts/build_conversation_goldens.py — each
# row is environment-portable (scope placeholders, curated overrides) and
# PII/secret-scanned.
# Run against a DISPOSABLE eval project (mutation rows create real entities):
#   export SSE_ENDPOINT_URL=http://localhost:8000/stream
#   export HARNESS_ACCOUNT=...
#   export HARNESS_ORG=...
#   export HARNESS_PROJECT=<disposable-eval-project>
#   export TOKEN=...
#   export OPENAI_API_KEY=...
#   export EVAL_RUN_SUFFIX="$(date +%s)"   # unique-ify created entity names
#   PYTHONPATH=. poetry run harness-evals run examples/prod-conversation.eval.yaml
# Full conversation trace (JSONL, one row per golden): examples/output/prod-conversation-results.jsonl
# JSON sink includes eval_case.messages (user/assistant/tool chronology from SSE timeline) plus metadata sse_events.
#
# conversation.mode is intentionally OMITTED: each golden carries its own mode
# (scripted for faithful replay of prod user turns). Setting a global mode here
# would override the per-row mode via _apply_conversation_defaults.

name: prod-conversation
concurrency: 1

plugins:
  - examples.sse_events_match_metric
  - examples.harness_sse_elicitation_adapter
  - examples.outcome_goal_metric

conversation:
  # mode omitted on purpose — goldens set their own mode per row.
  simulator_llm: {provider: openai, name: gpt-4o}
  elicitation_adapter: harness_sse

dataset: ./prod-conversation.goldens.jsonl

target:
  type: conversational_streaming_http
  url: "${SSE_ENDPOINT_URL}"
  headers:
    Content-Type: application/json
    Harness-account: "${HARNESS_ACCOUNT}"
    Authorization: "Bearer ${TOKEN}"

  user_body_template:
    prompt: "{{last_user_content}}"
    mode: standard
    stream: true
    context:
      is_v2: true
    harness_context:
      account_id: "${HARNESS_ACCOUNT}"
      org_id: "${HARNESS_ORG}"
      project_id: "${HARNESS_PROJECT}"

  continue_body_template:
    prompt: "{{last_user_content}}"
    conversation_id: "{{conversation_id}}"
    session_id: "{{session_id}}"
    mode: standard
    stream: true
    context:
      is_v2: true
    harness_context:
      account_id: "${HARNESS_ACCOUNT}"
      org_id: "${HARNESS_ORG}"
      project_id: "${HARNESS_PROJECT}"

  human_input_body_template:
    system_event: "{{human_input}}"
    conversation_id: "{{conversation_id}}"
    session_id: "{{session_id}}"
    mode: standard
    stream: true
    context:
      is_v2: true
    harness_context:
      account_id: "${HARNESS_ACCOUNT}"
      org_id: "${HARNESS_ORG}"
      project_id: "${HARNESS_PROJECT}"

  human_input_events:
    - elicitation_form
    - elicitation_free_text
    - elicitation_select
    - elicitation_multi_select
    - elicitation_yaml
  completion_events:
    - assistant_message
  session_metadata_event: stream_metadata
  session_fields:
    conversation_id: conversation_id
    session_id: session_id
  correlation_id_field: review_id

  output_event: assistant_message
  output_path: $.v
  capture_events:
    - stream_metadata
    - assistant_tool_request
    - assistant_tool_result
    - elicitation_form
    - elicitation_free_text
    - elicitation_select
    - elicitation_multi_select
    - elicitation_yaml
    - entity_mutation
    - assistant_message
    - model_usage

metrics:
  # Outcome-aware judge: scores against the golden's curated (environment-neutral)
  # expected_outcome, not just the visible transcript.
  - {kind: outcome_goal_accuracy, threshold: 0.7}
  # Per-row SSE assertions must ALL pass — writes must emit write-tool request+result,
  # reads must emit a tool request. Threshold 1.0 = no partial credit.
  - kind: sse_events_match
    threshold: 1.0
    params:
      row_checks_key: sse_checks

judge_llm: {provider: openai, name: gpt-4o}

sinks:
  - stdout
  - type: json
    path: examples/output/prod-conversation-results.jsonl
    include_eval_case: true
    omit_messages: false
    overwrite: true
